{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>All Rooms</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="container mt-4">

    <!-- BACK BUTTON -->
    <a href="/" class="btn btn-outline-dark rounded-pill mb-3">
        ← Back to Home
    </a>

    <h2 class="text-center fw-bold mb-4">
        All Rooms
    </h2>

    {% if rooms %}
    <div class="row g-4">

        {% for room in rooms %}
        <div class="col-12 col-sm-6 col-md-4">

            <div class="room-card">

                <div class="room-img">
                    {% if room.image1 %}
                        <img src="{{ room.image1.url }}">
                    {% else %}
                        <img src="{% static 'images/default.jpg' %}">
                    {% endif %}

                    <div class="price-badge">
                        ₹{{ room.price }}
                    </div>
                </div>

                <div class="room-info">
                    <h3>{{ room.title }}</h3>
                    <p>{{ room.location }}</p>

                    <a href="{% url 'room_detail' room.id %}" class="view-btn">
                        View Details →
                    </a>
                </div>

            </div>

        </div>
        {% endfor %}

    </div>
    {% else %}
        <p class="text-center">No rooms found</p>
    {% endif %}

</div>

</body>
</html>
