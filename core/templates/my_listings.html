{% load static %}
<!DOCTYPE html>
<html>
<head>
    <a href="javascript:history.back()" class="btn btn-secondary mb-3">
    ← Back
</a>
    <title>My Listings</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- YOUR CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
<div class="container mt-5">

    <h2 class="section-title text-center">
        My <span>Listings</span>
    </h2>

    {% if rooms %}
    <div class="row g-4 mt-4">
        {% for room in rooms %}
        <div class="col-12 col-sm-6 col-md-4">

            <div class="room-card">

                <div class="room-img">
                    <img src="{{ room.image1.url }}">
                    <div class="price-badge">
                        ₹ {{ room.price }}
                    </div>
                </div>

                <div class="card-body p-3">
                    <h5>{{ room.title }}</h5>
                    <p class="location">📍 {{ room.location }}</p>

                    <div class="mt-2">
                        <a href="{% url 'edit_room' room.id %}" class="btn btn-warning btn-sm rounded-pill">Edit</a>

                        <form method="POST" action="{% url 'delete_room' room.id %}" style="display:inline;">
                            {% csrf_token %}
                            <button class="btn btn-danger btn-sm rounded-pill">Delete</button>
                        </form>
                    </div>
                </div>

            </div>

        </div>
        {% endfor %}
    </div>

    {% else %}
    <div class="text-center mt-5">
        <h4>No rooms added yet 😔</h4>
        <p>Start by adding your first room</p>

        <a href="{% url 'add_room' %}" class="add-room-btn mt-3">
            ➕ Add Room
        </a>
    </div>
    {% endif %}

</div>
</head>
<body>
